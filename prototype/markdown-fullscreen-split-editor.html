<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown 全屏双栏编辑原型</title>
  <style>
    :root { color-scheme: light; --ink:#17233b; --muted:#68778e; --line:#dfe5ee; --soft:#f5f7fb; --brand:#5855e8; --brand-soft:#efefff; --ratio:50%; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; color:var(--ink); background:#f8fafc; font-size:14px; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:wait; opacity:.62; }
    button:focus-visible,input:focus-visible,textarea:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
    .icon { width:17px; height:17px; flex:none; stroke:currentColor; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .topbar { position:fixed; z-index:4; top:0; left:0; right:0; height:64px; display:flex; align-items:center; gap:28px; padding:0 28px; border-bottom:1px solid var(--line); background:#fff; }
    .brand { width:192px; flex:none; display:flex; align-items:center; gap:11px; color:#182440; font-size:16px; font-weight:800; white-space:nowrap; }
    .brand-mark { width:32px; height:32px; display:grid; place-items:center; border-radius:6px; background:var(--brand); color:#fff; }
    .search { width:min(560px,47vw); height:40px; display:flex; align-items:center; gap:9px; padding:0 13px; border:1px solid var(--line); border-radius:6px; background:#f8fafc; color:#9aa5b6; }
    .topbar-user { margin-left:auto; display:flex; align-items:center; gap:8px; font-weight:700; color:#526079; }
    .sidebar { position:fixed; z-index:3; top:64px; bottom:0; left:0; width:220px; padding:22px 11px; border-right:1px solid var(--line); background:#fff; }
    .nav-item { height:44px; display:flex; align-items:center; gap:12px; padding:0 14px; border-radius:6px; color:#617087; font-weight:700; }
    .nav-item.active { color:var(--brand); background:var(--brand-soft); }
    .app-main { margin-left:220px; padding:88px 28px 40px; }
    .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:20px; }
    .page-head-main { display:flex; gap:12px; align-items:flex-start; min-width:0; }
    h1 { margin:0; font-size:24px; line-height:1.25; }
    .subtitle { margin:7px 0 0; color:var(--muted); line-height:1.55; }
    .page-actions,.workspace-actions,.editor-actions { display:flex; align-items:center; gap:8px; flex:none; }
    .btn { min-height:36px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 13px; border:1px solid var(--line); border-radius:6px; background:#fff; color:#344159; font-weight:700; white-space:nowrap; transition:background .15s,border-color .15s,color .15s; }
    .btn:hover { border-color:#babaf8; background:#f5f5ff; color:var(--brand); }
    .btn.primary { border-color:var(--brand); background:var(--brand); color:#fff; }
    .btn.primary:hover { background:#4844d8; }
    .btn.icon-btn { width:36px; padding:0; }
    .editor-layout { display:grid; grid-template-columns:minmax(270px,340px) minmax(0,1fr); gap:16px; align-items:stretch; }
    .metadata { min-width:0; padding:20px; border:1px solid var(--line); border-radius:7px; background:#fff; box-shadow:0 2px 8px #15264b09; }
    .metadata h2 { display:none; }
    .field { display:grid; gap:8px; margin-bottom:20px; }
    .field:last-child { margin-bottom:0; }
    .field label { color:#7e8ba0; font-size:12px; font-weight:800; }
    .field input,.field textarea { width:100%; min-width:0; border:1px solid var(--line); border-radius:6px; padding:10px 11px; background:#fff; color:var(--ink); outline:none; }
    .field textarea { min-height:90px; resize:vertical; line-height:1.6; }
    .field input:focus,.field textarea:focus { border-color:var(--brand); box-shadow:0 0 0 3px #5855e819; }
    .field small { color:#8792a5; line-height:1.5; }
    .required { color:#e24556; }
    .workbench-head { display:none; }
    .editor-surface { min-width:0; min-height:660px; display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--line); border-radius:7px; background:#fff; box-shadow:0 2px 8px #15264b09; }
    .editor-head { height:48px; flex:none; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 16px; border-bottom:1px solid var(--line); font-weight:800; }
    .badge { display:inline-flex; align-items:center; height:25px; padding:0 8px; border:1px solid var(--line); border-radius:4px; color:#617087; font-size:11px; font-weight:700; }
    .panes { position:relative; display:flex; flex:1; min-height:0; }
    .pane { min-width:0; min-height:0; display:flex; flex-direction:column; flex:1; overflow:hidden; }
    .pane-head { height:44px; flex:none; display:none; align-items:center; justify-content:space-between; padding:0 18px; border-bottom:1px solid var(--line); color:#394863; font-size:12px; font-weight:800; letter-spacing:.02em; }
    .pane-head span:last-child { color:#98a3b6; font-weight:600; letter-spacing:0; }
    .code-wrap { display:flex; flex:1; min-height:0; background:#fcfdff; }
    .line-numbers { width:42px; flex:none; overflow:hidden; padding:18px 9px 18px 0; border-right:1px solid #edf0f5; color:#a1adbe; font:13px/24px ui-monospace,SFMono-Regular,Consolas,monospace; text-align:right; white-space:pre; user-select:none; }
    #source { width:100%; height:100%; min-height:610px; flex:1; resize:none; border:0; outline:0; padding:18px 20px; background:transparent; color:#26334b; font:13px/24px ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre-wrap; overflow-wrap:break-word; tab-size:2; }
    #source:focus-visible { outline:0; }
    .pane-preview { display:none; background:#fff; }
    .preview-scroll { min-height:0; flex:1; overflow:auto; padding:24px 32px 40px; }
    .preview-content { max-width:780px; margin:0 auto; color:#324056; font-size:15px; line-height:1.8; overflow-wrap:anywhere; }
    .preview-content h1,.preview-content h2,.preview-content h3 { line-height:1.35; color:#192943; }
    .preview-content h1 { margin:0 0 18px; padding-bottom:13px; border-bottom:1px solid var(--line); font-size:27px; }
    .preview-content h2 { margin:28px 0 12px; font-size:20px; }
    .preview-content h3 { margin:22px 0 9px; font-size:17px; }
    .preview-content p { margin:0 0 15px; }
    .preview-content ul { margin:0 0 16px; padding-left:25px; }
    .preview-content li { padding-left:3px; }
    .preview-content li::marker { color:#8883e9; }
    .preview-content code { padding:2px 5px; border-radius:4px; background:#eef0f7; color:#8c3b67; font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .preview-content pre { overflow:auto; margin:0 0 18px; padding:17px 19px; border-radius:6px; background:#182235; color:#e5eaf5; font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .preview-content pre code { padding:0; background:transparent; color:inherit; }
    .preview-content blockquote { margin:0 0 16px; padding:7px 15px; border-left:3px solid #8581ec; background:#f7f7ff; color:#57657a; }
    .empty-state { display:grid; place-items:center; min-height:100%; color:#8793a6; font-size:14px; text-align:center; }
    .divider { display:none; }
    .status { display:inline-flex; align-items:center; gap:7px; color:#758197; font-size:12px; white-space:nowrap; }
    .status-dot { width:7px; height:7px; border-radius:50%; background:#f5a63d; }
    .status.saved .status-dot { background:#2ba77e; }
    .mobile-tabs { display:none; }
    .backdrop { display:none; }
    .toast { position:fixed; z-index:130; right:24px; bottom:24px; max-width:min(340px,calc(100vw - 32px)); padding:13px 17px; border:1px solid #c9e8d7; border-radius:6px; background:#f2fff7; color:#186746; font-weight:700; box-shadow:0 12px 30px #15264b20; }
    .toast[hidden] { display:none; }
    .full .editor-layout { position:fixed; z-index:100; inset:0; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:58px minmax(0,1fr); gap:0; overflow:hidden; background:#fff; }
    .full .workbench-head { min-width:0; display:flex; align-items:center; gap:13px; padding:0 20px; border-bottom:1px solid var(--line); background:#fff; }
    .full .workbench-title { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; font-weight:800; }
    .full .workspace-actions { margin-left:auto; }
    .full .editor-surface { grid-row:2; min-height:0; border:0; border-radius:0; box-shadow:none; }
    .full .editor-head { display:none; }
    .full .panes { display:grid; grid-template-columns:minmax(0,var(--ratio)) 8px minmax(0,1fr); }
    .full .pane-head { display:flex; }
    .full .pane-preview { display:flex; }
    .full .pane-source { grid-column:1; }
    .full .pane-preview { grid-column:3; }
    .full .divider { grid-column:2; z-index:1; display:block; width:8px; border:0; border-left:1px solid #e0e5ed; border-right:1px solid #e0e5ed; background:#f4f6fa; cursor:col-resize; touch-action:none; }
    .full .divider:hover,.full .divider:focus-visible { background:#dedcff; border-color:#bab8f8; }
    .full #source { min-height:0; }
    .full .metadata { position:fixed; z-index:112; top:58px; right:0; bottom:0; width:min(380px,100vw); overflow:auto; border-radius:0; border-top:0; border-right:0; box-shadow:-16px 0 32px #17233b17; transform:translateX(101%); transition:transform .2s ease; }
    .full .metadata.open { transform:translateX(0); }
    .full .metadata h2 { display:flex; align-items:center; justify-content:space-between; margin:0 0 23px; font-size:17px; }
    .full .backdrop.open { position:fixed; z-index:111; inset:58px 0 0; display:block; border:0; background:#121d3459; }
    @media (max-width:1100px) { .search { display:none; } .editor-layout { grid-template-columns:minmax(230px,300px) minmax(0,1fr); } }
    @media (max-width:780px) {
      .topbar,.sidebar { display:none; }
      .app-main { margin:0; padding:20px 16px; }
      .page-head { flex-wrap:wrap; }
      .page-actions { width:100%; justify-content:flex-end; }
      .editor-layout { grid-template-columns:minmax(0,1fr); }
      .editor-surface { min-height:520px; }
      .full .workbench-head { gap:8px; padding:0 10px; }
      .full .workbench-title { font-size:13px; }
      .full .workspace-actions { gap:5px; }
      .full .workspace-actions .btn { min-width:36px; padding:0 9px; }
      .full .workspace-actions .btn .label { display:none; }
      .full .workspace-actions .status { display:none; }
      .full .panes { display:flex; flex-direction:column; }
      .full .pane { flex:1; }
      .full .pane-preview,.full .pane-source { display:none; }
      .full .pane.active { display:flex; }
      .full .divider { display:none; }
      .full .pane-head { display:none; }
      .full .mobile-tabs { height:44px; flex:none; display:flex; border-bottom:1px solid var(--line); }
      .mobile-tabs button { width:50%; border:0; border-bottom:2px solid transparent; background:#fff; color:#6f7d92; font-weight:700; }
      .mobile-tabs button.active { border-bottom-color:var(--brand); color:var(--brand); }
      .full .preview-scroll { padding:22px 20px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition-duration:0s !important; animation-duration:0s !important; } }
  </style>

在组件中，**状态**负责保存会随交互变化的数据。使用 `useState` 更新状态后，React 会重新渲染组件。

## 什么时候使用 Effect

Effect 用于同步组件与外部系统，例如浏览器事件、计时器或网络连接。

- 不要用 Effect 计算可以在渲染期间得出的值。
- 订阅外部事件时，记得在清理函数中取消订阅。
- 将相互独立的同步过程拆成不同的 Effect。

## 简短示例

```tsx
useEffect(() => {
  const connection = connect(roomId);
  return () => connection.disconnect();
}, [roomId]);
```

> 先明确要同步的外部系统，再决定是否需要 Effect。</textarea></div></div><button class="divider" id="divider" type="button" title="拖动调整双栏宽度" aria-label="调整编辑和预览列宽"></button><div class="pane pane-preview" id="previewPane"><div class="pane-head"><span>实时预览</span><span id="previewState">已同步</span></div><div class="preview-scroll" id="previewScroll"><article class="preview-content" id="previewContent"></article></div></div></div></section>

  <script>
    const body = document.body;
    const layout = document.getElementById('editorLayout');
    const metadata = document.getElementById('metadata');
    const backdrop = document.getElementById('backdrop');
    const source = document.getElementById('source');
    const previewContent = document.getElementById('previewContent');
    const previewState = document.getElementById('previewState');
    const sourcePane = document.getElementById('sourcePane');
    const previewPane = document.getElementById('previewPane');
    const normalPreview = document.getElementById('normalPreview');
    const normalPreviewText = document.getElementById('normalPreviewText');
    const noteTitle = document.getElementById('noteTitle');
    const noteSummary = document.getElementById('noteSummary');
    const noteTags = document.getElementById('noteTags');
    const saveStatus = document.getElementById('saveStatus');
    const saveStatusText = document.getElementById('saveStatusText');
    const toast = document.getElementById('toast');
    let normalIsPreview = false;
    let mobileTab = 'edit';
    let toastTimer;
    function escapeHtml(value) { return value.replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character])); }
    function inline(value) { return escapeHtml(value).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); }
    function renderMarkdown(value) {
      if (!value.trim()) return '<div class="empty-state">暂无可预览的 Markdown 内容</div>';
      const lines = value.replace(/\r\n/g,'\n').split('\n');
      const output = [];
      let list = false;
      let code = false;
      let codeLines = [];
      function closeList() { if (list) { output.push('</ul>'); list = false; } }
      for (const line of lines) {
        if (/^```/.test(line)) {
          closeList();
          if (code) { output.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>'); codeLines=[]; code=false; }
          else code=true;
          continue;
        }
        if (code) { codeLines.push(line); continue; }
        if (!line.trim()) { closeList(); continue; }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) { closeList(); const level=heading[1].length; output.push('<h'+level+'>'+inline(heading[2])+'</h'+level+'>'); continue; }
        const bullet = line.match(/^[-*]\s+(.+)$/);
        if (bullet) { if (!list) { output.push('<ul>'); list=true; } output.push('<li>'+inline(bullet[1])+'</li>'); continue; }
        closeList();
        if (/^>\s?/.test(line)) output.push('<blockquote>'+inline(line.replace(/^>\s?/,''))+'</blockquote>');
        else output.push('<p>'+inline(line)+'</p>');
      }
      closeList();
      if (code) output.push('<pre><code>'+escapeHtml(codeLines.join('\n'))+'</code></pre>');
      return output.join('');
    }
    function updatePreview() { try { previewContent.innerHTML=renderMarkdown(source.value); previewState.textContent='已同步'; } catch { previewContent.innerHTML='<div class="empty-state">预览暂时不可用，请继续编辑正文</div>'; previewState.textContent='预览失败'; } }
    function updateLines() { const count=source.value.split('\n').length; document.getElementById('lineNumbers').textContent=Array.from({length:count},(_,index)=>index+1).join('\n'); document.getElementById('lineNumbers').scrollTop=source.scrollTop; }
    function markDirty() { saveStatus.classList.remove('saved'); saveStatusText.textContent='未保存更改'; }
    function setFull(value) { body.classList.toggle('full',value); body.style.overflow=value?'hidden':''; document.querySelectorAll('.topbar,.sidebar,.page-head').forEach(element=>element.inert=value); closeMetadata(); applyPaneState(); if(value) source.focus(); else document.getElementById('enterFull').focus(); }
    function openMetadata() { metadata.inert=false; metadata.classList.add('open'); backdrop.classList.add('open'); noteTitle.focus(); }
    function closeMetadata() { metadata.classList.remove('open'); backdrop.classList.remove('open'); metadata.inert=body.classList.contains('full'); }
    function applyPaneState() {
      const mobile = window.matchMedia('(max-width:780px)').matches;
      if (!body.classList.contains('full')) {
        sourcePane.style.display=normalIsPreview?'none':'flex';
        previewPane.style.display=normalIsPreview?'flex':'none';
      } else {
        sourcePane.style.display=''; previewPane.style.display='';
        sourcePane.classList.toggle('active',!mobile || mobileTab==='edit');
        previewPane.classList.toggle('active',!mobile || mobileTab==='preview');
      }
      document.getElementById('tabEdit').classList.toggle('active',mobileTab==='edit');
      document.getElementById('tabPreview').classList.toggle('active',mobileTab==='preview');
      document.getElementById('tabEdit').setAttribute('aria-selected',String(mobileTab==='edit'));
      document.getElementById('tabPreview').setAttribute('aria-selected',String(mobileTab==='preview'));
    }
    function showToast(message,error=false) { toast.textContent=message; toast.style.borderColor=error?'#f5c6ca':'#c9e8d7'; toast.style.background=error?'#fff5f5':'#f2fff7'; toast.style.color=error?'#a32e3e':'#186746'; toast.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.hidden=true,3000); }
    function save() {
      if (!noteTitle.value.trim()) { showToast('请输入标题',true); openMetadata(); noteTitle.focus(); return; }
      if (!source.value.trim()) { showToast('请输入正文内容',true); source.focus(); return; }
      if (!noteTags.value.split(/[,，]/).some(tag=>tag.trim())) { showToast('请至少添加一个标签',true); openMetadata(); noteTags.focus(); return; }
      document.querySelectorAll('.save-btn').forEach(button=>button.disabled=true);
      saveStatusText.textContent='保存中...';
      setTimeout(()=>{ saveStatus.classList.add('saved'); saveStatusText.textContent='已保存'; document.querySelectorAll('.save-btn').forEach(button=>button.disabled=false); showToast('笔记已保存（原型演示）'); },550);
    }
    document.getElementById('enterFull').addEventListener('click',()=>setFull(true));
    document.getElementById('exitFull').addEventListener('click',()=>setFull(false));
    document.getElementById('openMetadata').addEventListener('click',openMetadata);
    document.getElementById('closeMetadata').addEventListener('click',closeMetadata);
    backdrop.addEventListener('click',closeMetadata);
    document.addEventListener('keydown',event=>{ if(event.key==='Escape' && body.classList.contains('full')) { if(metadata.classList.contains('open')) { closeMetadata(); document.getElementById('openMetadata').focus(); } else setFull(false); } });
    normalPreview.addEventListener('click',()=>{ normalIsPreview=!normalIsPreview; normalPreviewText.textContent=normalIsPreview?'编辑':'预览'; applyPaneState(); });
    document.getElementById('tabEdit').addEventListener('click',()=>{ mobileTab='edit'; applyPaneState(); source.focus(); });
    document.getElementById('tabPreview').addEventListener('click',()=>{ mobileTab='preview'; applyPaneState(); });
    source.addEventListener('input',()=>{ updateLines(); updatePreview(); markDirty(); });
    source.addEventListener('scroll',updateLines);
    [noteTitle,noteSummary,noteTags,document.getElementById('noteCategory')].forEach(input=>input.addEventListener('input',()=>{ document.getElementById('workspaceTitle').textContent=noteTitle.value.trim() || '未命名笔记'; document.getElementById('titleCount').textContent=noteTitle.value.length+'/200'; document.getElementById('summaryCount').textContent=noteSummary.value.length+'/500'; markDirty(); }));
    document.querySelectorAll('.save-btn').forEach(button=>button.addEventListener('click',save));
    window.addEventListener('resize',applyPaneState);
    const divider=document.getElementById('divider');
    divider.addEventListener('pointerdown',event=>{ if(window.matchMedia('(max-width:780px)').matches)return; divider.setPointerCapture(event.pointerId); document.body.style.cursor='col-resize'; });
    divider.addEventListener('pointermove',event=>{ if(!divider.hasPointerCapture(event.pointerId))return; const rect=document.getElementById('panes').getBoundingClientRect(); const ratio=Math.max(35,Math.min(70,(event.clientX-rect.left)/rect.width*100)); layout.style.setProperty('--ratio',ratio+'%'); });
    divider.addEventListener('pointerup',event=>{ if(divider.hasPointerCapture(event.pointerId))divider.releasePointerCapture(event.pointerId); document.body.style.cursor=''; });
    divider.addEventListener('keydown',event=>{ if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return; event.preventDefault(); const current=parseFloat(layout.style.getPropertyValue('--ratio'))||50; layout.style.setProperty('--ratio',Math.max(35,Math.min(70,current+(event.key==='ArrowRight'?2:-2)))+'%'); });
    document.getElementById('summaryCount').textContent=noteSummary.value.length+'/500';
    document.getElementById('titleCount').textContent=noteTitle.value.length+'/200';
    document.getElementById('workspaceTitle').textContent=noteTitle.value;
    updateLines(); updatePreview(); applyPaneState();
  </script>
</body>
</html>
