;border-radius:6px;font-size:12px;overflow:hidden}.mini-file{padding:8px 11px;border-bottom:1px solid #f1f5f9;display:flex;gap:10px;justify-content:space-between;overflow-wrap:anywhere}.mini-file:first-child{background:#fafbfc;color:#64748b}.mini-file:last-child{border:0}.toast{position:fixed;bottom:24px;right:24px;z-index:100;background:#fff;color:#334155;padding:13px 18px;border:1px solid #c7d2fe;border-radius:7px;box-shadow:0 6px 30px #0f172a15;max-width:calc(100vw - 32px);font-size:13px}.mobile-menu{display:none}.footer-note{margin-top:20px;color:#94a3b8;font-size:11px}.history-highlight{color:#4f46e5;font-weight:600}.trailing{color:#94a3b8;font-size:11px;margin-top:4px}body.modal-open{overflow:hidden}.backbutton{padding-left:0}.version-select{max-width:260px}.more-info{padding:15px 18px;border-top:1px solid var(--border);color:#94a3b8;font-size:11px;display:flex;justify-content:space-between;gap:10px}.name-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sc-name{overflow-wrap:anywhere}.mobile-nav-open .sidebar{display:flex;box-shadow:8px 0 40px #0f172a22}.menu-scrim{display:none}.mobile-nav-open .menu-scrim{display:block;position:fixed;inset:64px 0 0;background:#0f172a33;z-index:14;border:0}

<body>
<header class="topbar"><button class="btn icon mobile-menu" id="menu" aria-label="展开导航" aria-expanded="false"></button><div class="brand"><span class="brandmark" data-icon="boxes"></span>Prompt Skill Manager</div><div class="global"><span data-icon="search"></span><span>搜索 Prompt、笔记、解决方案…</span></div><div class="account"><span data-icon="user"></span>Admin</div></header>
<button class="menu-scrim" aria-label="关闭导航" id="scrim"></button>
<aside class="sidebar"><nav aria-label="主导航">
<div class="nav disabled"><span data-icon="home"></span>Prompt 列表</div>
<div class="nav active" aria-current="page"><span data-icon="boxes"></span>SKILL center</div>
<div class="nav disabled"><span data-icon="star"></span>我的收藏</div>
<div class="nav disabled"><span data-icon="bulb"></span>解决方案</div>
<div class="nav disabled"><span data-icon="file"></span>学习笔记</div>
<div class="nav disabled"><span data-icon="book"></span>杂谈</div>
<div class="nav disabled"><span data-icon="message"></span>模型回答</div>
<div class="nav disabled"><span data-icon="tag"></span>标签词云</div>
<div class="nav disabled"><span data-icon="layout"></span>UI 原型</div>
<div class="nav-section">管理</div><div class="nav disabled"><span data-icon="folder"></span>分类管理</div><div class="nav disabled"><span data-icon="tag"></span>标签管理</div><div class="nav disabled"><span data-icon="image"></span>图床白名单</div>
</nav><div class="side-bottom"><span class="dot"></span>个人工作空间<small style="display:block;margin-top:5px">仅管理员可访问 SKILL</small></div></aside>
<main class="main" id="app"></main>
<dialog id="upload" aria-labelledby="upload-title">
<div class="modal-head"><div><h2 id="upload-title">上传 SKILL</h2><p class="subtitle" id="upload-subtitle">将本地 SKILL 保存到个人仓库。</p></div><button class="btn icon ghost" data-close="upload" aria-label="关闭上传窗口" data-icon="x"></button></div>
<div class="modal-body"><div class="stepper" id="stepper"><span class="current">1 选择文件</span><span>—</span><span>2 确认并保存</span></div>
<div id="choose-step"><div class="dropzone" id="dropzone"><span data-icon="upload"></span><strong>选择或拖入 SKILL 文件</strong><small>支持 SKILL.md 或完整目录 ZIP · 最大 10 MiB</small><input id="file-input" type="file" accept=".md,.zip" aria-label="选择 SKILL.md 或 ZIP 文件"></div><div class="sample"><span>也可以先体验目录包的完整流程</span><button class="btn small" id="sample-package">载入示例目录包</button></div><p class="error" id="file-error" role="alert"></p></div>
<form id="skill-form" hidden><div class="selected-package" id="package-info"></div><div class="form-grid"><label class="field"><span>展示名称 <span class="required">*</span></span><input class="input" id="skill-name" required maxlength="160" placeholder="例如 code-review"></label><label class="field">简介<input class="input" id="skill-desc" maxlength="500" placeholder="描述这个 SKILL 的用途"></label><label class="field" id="source-field" hidden><span>SKILL.md 内容 <span class="required">*</span></span><textarea class="source" id="skill-source" spellcheck="false"></textarea></label><label class="field"><span>变更说明 <span class="required">*</span></span><textarea id="skill-note" required maxlength="500" placeholder="说明本次更新了什么"></textarea></label></div><div class="mini-files" id="package-files"></div><p class="warning hidden" id="format-warning"></p><label class="field hidden" id="format-confirm-row"><span><input type="checkbox" id="format-confirm"> 我确认以单文件替换目录包，新版本将不含其他文件</span></label><p class="error" id="save-error" role="alert"></p></form>
</div><div class="modal-foot"><button class="btn" data-close="upload">取消</button><button class="btn primary" id="save-skill" disabled>保存 SKILL</button></div>
</dialog>
<dialog id="remove" aria-labelledby="remove-title"><div class="modal-head"><h2 id="remove-title">删除 SKILL</h2><button class="btn icon ghost" data-close="remove" aria-label="关闭删除窗口" data-icon="x"></button></div><div class="modal-body"><p id="remove-description"></p><p class="warning" style="margin-top:16px">删除后，文件及所有历史版本将无法从界面恢复。</p></div><div class="modal-foot"><button class="btn" data-close="remove">取消</button><button class="btn danger" id="confirm-remove">确认删除</button></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
/** @typedef {{path:string, text:string|null, size?:number}} SkillFile */
/** @typedef {{number:number, date:string, note:string, name?:string, description?:string, kind:'ZIP'|'MD', files:SkillFile[], source:string, artifact?:File}} SkillVersion */
/** @typedef {{id:string, name:string, description:string, versions:SkillVersion[]}} Skill */

function lineDiff(a,b){const x=a.split('\n'),y=b.split('\n');if(x.length*y.length>180000)return null;const dp=Array.from({length:x.length+1},()=>new Uint16Array(y.length+1));for(let i=x.length-1;i>=0;i--)for(let j=y.length-1;j>=0;j--)dp[i][j]=x[i]===y[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0;const left=[],right=[];while(i<x.length||j<y.length){if(i<x.length&&j<y.length&&x[i]===y[j]){left.push({text:x[i],num:++i,type:''});right.push({text:y[j],num:++j,type:''});}else if(j<y.length&&(i===x.length||dp[i][j+1]>=dp[i+1][j])){left.push({text:'',num:'',type:''});right.push({text:y[j],num:++j,type:'added'});}else{left.push({text:x[i],num:++i,type:'removed'});right.push({text:'',num:'',type:''});}}return {left,right};}
function renderCompare(s){const a=s.versions.find(v=>v.number===leftVersion)||s.versions[0],b=s.versions.find(v=>v.number===rightVersion)||latest(s),changes=changedFiles(a,b).sort((x,y)=>(x.status==='未变')-(y.status==='未变')),entry=changes.find(f=>f.path===diffPath)||changes[0];diffPath=entry.path;const opts=n=>s.versions.slice().reverse().map(v=>`<option value="${v.number}" ${v.number===n?'selected':''}>v${v.number}${v.number===latest(s).number?' · 当前':''}</option>`).join('');
$('detail-content').innerHTML=`<div class="compare-controls"><label class="field-inline">旧版<select class="select" id="compare-left">${opts(a.number)}</select></label><button class="btn icon" id="swap" title="交换对比方向" aria-label="交换对比方向">${icon('swap')}</button><label class="field-inline">新版<select class="select" id="compare-right">${opts(b.number)}</select></label><div class="compare-summary">${['新增','修改','删除'].map(state=>`<span class="badge ${changeClass(state)}">${changes.filter(f=>f.status===state).length} ${state}</span>`).join('')}</div></div><div class="surface">${a.number===b.number?'<div class="empty">'+icon('history')+'<h3>所选版本相同</h3><p>选择不同版本以查看变化。</p></div>':`<div class="diff-grid"><aside class="filetree"><h3>文件变化 · ${changes.filter(f=>f.status!=='未变').length}</h3>${changes.map(f=>`<button class="fileitem ${f.path===diffPath?'active':''}" data-diff-file="${esc(f.path)}"><span class="badge ${changeClass(f.status)}">${f.status}</span><span>${esc(f.path)}</span></button>`).join('')}</aside><div><div class="filebar"><strong>${esc(entry.path)}</strong><span class="badge ${changeClass(entry.status)}">${entry.status}</span></div><div id="diff-content"></div></div></div>`}</div>`;
$('compare-left').onchange=e=>{leftVersion=Number(e.target.value);renderCompare(s);};$('compare-right').onchange=e=>{rightVersion=Number(e.target.value);renderCompare(s);};$('swap').onclick=()=>{leftVersion=b.number;rightVersion=a.number;renderCompare(s);};document.querySelectorAll('[data-diff-file]').forEach(el=>el.onclick=()=>{diffPath=el.dataset.diffFile;renderCompare(s);});if(a.number===b.number)return;if(entry.old?.text===null||entry.fresh?.text===null){$('diff-content').innerHTML='<div class="empty"><h3>二进制文件</h3><p>不提供文本对比，请下载对应版本。</p></div>';return;}const result=lineDiff(entry.old?.text||'',entry.fresh?.text||'');if(!result){$('diff-content').innerHTML='<div class="empty">文件较大，无法在线对比，请下载查看。</div>';return;}$('diff-content').innerHTML=`<div class="diff-panes">${[['left',a,entry.old],['right',b,entry.fresh]].map(([key,v,f])=>`<div class="diff-pane"><div class="diff-heading"><strong>v${v.number} · ${key==='left'?'旧版':'新版'}</strong><span>${f?bytes(sizeOf(f)):'此版本无该文件'}</span></div><pre class="diff-code">${result[key].map(l=>`<span class="diff-line ${l.type}"><span class="ln">${l.num}</span><span class="sign">${l.type==='added'?'+':l.type==='removed'?'−':' '}</span><span>${esc(l.text)||' '}</span></span>`).join('')}</pre></div>`).join('')}</div>`;}
function openDialog(id){$(id).showModal();document.body.classList.add('modal-open');}
function closeDialog(id){$(id).close();document.body.classList.remove('modal-open');if(id==='upload')selectionEpoch++;}
document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>closeDialog(el.dataset.close));document.querySelectorAll('dialog').forEach(d=>d.addEventListener('close',()=>{if(d.open)return;document.body.classList.remove('modal-open');if(d.id==='upload')selectionEpoch++;}));
function openUpload(id=null,manual=false){targetId=id;candidate=null;selectionEpoch++;const s=id?skills.find(s=>s.id===id):null;$('file-input').value='';$('skill-form').reset();$('file-error').textContent='';$('save-error').textContent='';$('upload-title').textContent=manual?'新增 SKILL':s?'上传新版本':'上传 SKILL';$('upload-subtitle').textContent=s?'更新 '+s.name+' · 当前 v'+latest(s).number:'将本地 SKILL 保存到个人仓库。';$('choose-step').hidden=manual;$('skill-form').hidden=!manual;$('stepper').hidden=manual;$('source-field').hidden=!manual;$('package-files').hidden=manual;$('package-info').hidden=manual;$('save-skill').disabled=!manual;$('save-skill').textContent=s?'保存为 v'+(latest(s).number+1):'保存 SKILL';$('format-warning').classList.add('hidden');$('format-confirm-row').classList.add('hidden');if(manual){candidate={kind:'MD',files:[],source:'SKILL.md'};$('skill-source').value=entry('my-skill','描述 SKILL 的用途。','# My Skill\n\n## 使用场景\n\n## 工作流程\n');$('skill-note').value='首次创建';}openDialog('upload');}
function setCandidate(value,name,desc){candidate=value;$('choose-step').hidden=true;$('skill-form').hidden=false;$('stepper').innerHTML='<span>1 选择文件</span><span>—</span><span class="current">2 确认并保存</span>';$('package-info').hidden=false;$('package-info').innerHTML=icon(value.kind==='ZIP'?'boxes':'file')+`<div><strong>${esc(value.source)}</strong><div><small>${value.files.length} 个文件 · ${value.kind==='ZIP'?'完整目录包':'单文件'}</small></div></div><button class="btn small" type="button" id="reselect">更换</button>`;$('reselect').onclick=()=>openUpload(targetId);const s=targetId?skills.find(s=>s.id===targetId):null;$('skill-name').value=s?.name||name;$('skill-desc').value=s?.description||desc;$('skill-note').value=s?'':'首次上传';$('package-files').hidden=false;$('package-files').innerHTML='<div class="mini-file"><strong>识别到的文件</strong><span>大小</span></div>'+value.files.map(f=>`<div class="mini-file"><span>${esc(f.path)}</span><span>${bytes(sizeOf(f))}</span></div>`).join('');const downgrade=s&&latest(s).kind==='ZIP'&&value.kind==='MD';$('format-warning').classList.toggle('hidden',!downgrade);$('format-confirm-row').classList.toggle('hidden',!downgrade);$('format-warning').textContent='此更新将以单文件替换目录包。新版本不会包含原包的脚本与参考文件；历史版本仍然保留。';$('save-skill').disabled=false;$('skill-name').focus();}
/** 异步文件读取使用序号隔离，关闭或重选后忽略旧结果。 */
async function readFile(file){const epoch=++selectionEpoch;$('file-error').textContent='';if(!file)return;if(file.size>10*1024*1024){$('file-error').textContent='文件超过 10 MiB，请缩小后重新选择。';return;}if(file.name.toLowerCase().endsWith('.zip')){$('file-error').textContent='此静态原型不解析真实 ZIP，尚未保存。请使用“载入示例目录包”体验文件浏览和版本对比。';return;}if(file.name!=='SKILL.md'){$('file-error').textContent='请选择文件名为 SKILL.md 的 Markdown 文件，或完整目录 ZIP。';return;}$('save-skill').disabled=true;$('file-error').textContent='正在读取文件…';try{const text=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());if(epoch!==selectionEpoch)return;if(!text.trim())throw new Error('SKILL.md 内容不能为空。');const name=text.match(/^name:\s*(.+)$/m)?.[1]?.replace(/^["']|["']$/g,'')||'untitled-skill';const desc=text.match(/^description:\s*(.+)$/m)?.[1]||'';setCandidate({kind:'MD',files:[{path:'SKILL.md',text}],source:file.name,artifact:file},name,desc);$('file-error').textContent='';}catch(error){if(epoch===selectionEpoch)$('file-error').textContent=error instanceof TypeError?'无法读取 UTF-8 文本，请检查文件编码。':error.message;}}
$('file-input').onchange=e=>readFile(e.target.files[0]);const dz=$('dropzone');dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag');};dz.ondragleave=()=>dz.classList.remove('drag');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag');readFile(e.dataTransfer.files[0]);};
$('sample-package').onclick=()=>{selectionEpoch++;const s=targetId?skills.find(s=>s.id===targetId):null;const n=s?latest(s).number+1:1;const files=reviewFiles(Math.min(3,n));if(n>3)files[0].text+='\n## 补充检查 '+n+'\n确认本次变更的验证范围。\n';setCandidate({kind:'ZIP',files,source:'code-review.zip'},'code-review','基于真实调用链审查代码变更。');};
$('skill-form').onsubmit=e=>{e.preventDefault();saveSkill();};$('save-skill').onclick=()=>{$('skill-form').requestSubmit();};
function saveSkill(){if(!candidate)return;$('save-error').textContent='';const name=$('skill-name').value.trim(),desc=$('skill-desc').value.trim(),note=$('skill-note').value.trim();if(!name||!note){$('save-error').textContent='请填写展示名称与变更说明。';return;}if(!$('source-field').hidden){const text=$('skill-source').value;if(!text.trim()){$('save-error').textContent='SKILL.md 内容不能为空。';return;}candidate.files=[{path:'SKILL.md',text}];}if(!$('format-confirm-row').classList.contains('hidden')&&!$('format-confirm').checked){$('save-error').textContent='请确认目录包切换为单文件的影响。';return;}const duplicate=skills.find(s=>s.name===name&&s.id!==targetId);if(duplicate){$('save-error').textContent='已存在同名 SKILL。请在该 SKILL 详情上传新版本，或修改展示名称后另建。';return;}const s=targetId?skills.find(s=>s.id===targetId):null;if(s&&JSON.stringify(latest(s).files)===JSON.stringify(candidate.files)&&s.name===name&&s.description===desc){$('save-error').textContent='文件内容及元信息没有变化，无需创建新版本。';return;}const button=$('save-skill');button.disabled=true;button.textContent='正在保存…';const saveEpoch=selectionEpoch,snapshot={...candidate,files:candidate.files.map(f=>({...f}))};setTimeout(()=>{if(saveEpoch!==selectionEpoch)return;const v={number:s?latest(s).number+1:1,date:now(),note,name,description:desc,...snapshot};let id;if(s){s.name=name;s.description=desc;s.versions.push(v);id=s.id;}else{id='skill-'+Date.now();skills.unshift({id,name,description:desc,versions:[v]});}closeDialog('upload');openSkill(id);toast(s?'已保存新版本 v'+v.number:'SKILL 已保存');},450);}
function removeSkill(id){deletingId=id;const s=skills.find(s=>s.id===id);$('remove-description').textContent='确认删除 '+s.name+' 及其全部 '+s.versions.length+' 个历史版本？';openDialog('remove');}
$('confirm-remove').onclick=()=>{skills=skills.filter(s=>s.id!==deletingId);closeDialog('remove');render();toast('SKILL 及全部历史已删除');};
/** 生成无压缩 ZIP，仅用于可下载的示例文件；路径限定为示例相对路径。 */
function zipBlob(files,root){const encoder=new TextEncoder(),locals=[],central=[];let offset=0;function crc32(data){let c=0xffffffff;for(const x of data){c^=x;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0);}return(c^0xffffffff)>>>0;}function header(length){const u=new Uint8Array(length);return[u,new DataView(u.buffer)];}for(const f of files){const path=encoder.encode(root+'/'+f.path),data=encoder.encode(f.text||''),crc=crc32(data);const [l,lv]=header(30);lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x800,true);lv.setUint16(12,0x5b61,true);lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,path.length,true);locals.push(l,path,data);const [c,cv]=header(46);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);cv.setUint16(14,0x5b61,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,path.length,true);cv.setUint32(42,offset,true);central.push(c,path);offset+=30+path.length+data.length;}const centralSize=central.reduce((n,a)=>n+a.length,0),[end,ev]=header(22);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);return new Blob([...locals,...central,end],{type:'application/zip'});}
function download(s,v=latest(s)){const safe=s.name.replace(/[^a-zA-Z0-9_-]/g,'-')||'skill',blob=v.artifact||(v.kind==='ZIP'?zipBlob(v.files,safe):new Blob([v.files[0].text],{type:'text/markdown;charset=utf-8'}));const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=v.kind==='ZIP'?safe+'-v'+v.number+'.zip':'SKILL.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已发起下载 '+s.name+' · v'+v.number);}
function toggleMenu(force){const next=force??!document.body.classList.contains('mobile-nav-open');document.body.classList.toggle('mobile-nav-open',next);$('menu').setAttribute('aria-expanded',String(next));}$('menu').onclick=()=>toggleMenu();$('scrim').onclick=()=>toggleMenu(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleMenu(false);});
render();
</script>
