  <script>
    // ?state=loading / error / empty 可用于检查目录状态；不在实际界面添加演示控件。
    /** @typedef {{ id: string, text: string, level: number, line: number }} Heading */
    /** @typedef {{ line: number, element: HTMLElement }} PreviewBlock */
    const byId = (id) => document.getElementById(id);
    const source = byId('sourceEditor');
    const sourceScroll = byId('sourceScroll');
    const previewScroll = byId('previewScroll');
    const preview = byId('previewContent');
    const outline = byId('outline');
    const toc = byId('toc');
    const editing = byId('editing');
    const metadata = byId('metadata');
    const panes = byId('panes');
    const scrim = byId('scrim');
    const wide = matchMedia('(min-width: 1280px)');
    const split = matchMedia('(min-width: 961px)');
    /** @type {Heading[]} */
    let headings = [];
    /** @type {PreviewBlock[]} */
    let blocks = [];
    let tocOpen = wide.matches;
    let metadataOpen = false;
    let restoreToc = false;
    let activeId = '';
    let syncEnabled = true;
    let ratio = 50;
    let updateTimer = 0;
    let syncFrame = 0;
    let programmaticUntil = 0;
    let toastTimer = 0;
    let previewRevision = 0;
    let currentText = '';
    const demoText = [
      '# React 组件状态与副作用', '',
      '状态描述组件当前的界面，Effect 负责与外部系统同步。理解这两者的边界，可以让组件更容易维护。', '',
      '## 1. 理解组件状态', '',
      '使用 `useState` 保存会随交互变化的数据。调用更新函数后，React 会为组件安排一次新的渲染。', '',
      '### 状态是一次渲染的快照', '',
      '每次渲染得到的状态值都是固定的。事件处理函数读取的是创建该函数时对应的状态，而不是未来某次渲染的状态。', '',
      '```tsx', 'const [count, setCount] = useState(0);', '', 'function increment() {', '  setCount(previous => previous + 1);', '}', '```', '',
      '### 选择合适的状态结构', '',
      '- 将始终一起变化的数据组织在一起。', '- 避免保存可以从已有状态计算出的数据。', '- 使用稳定的标识关联列表中的元素。', '',
      '## 2. 什么时候使用 Effect', '',
      '当组件需要与 React 之外的系统保持同步时，使用 Effect。例如订阅浏览器事件、建立网络连接或管理计时器。', '',
      '### 与外部系统同步', '',
      '先明确连接的生命周期，再决定依赖项。组件重新渲染并不意味着需要重新创建每一个外部连接。', '',
      '```tsx', 'useEffect(() => {', '  const connection = connect(roomId);', '  connection.open();', '  return () => connection.close();', '}, [roomId]);', '```', '',
      '### 依赖项与清理函数', '',
      '当依赖项发生变化时，React 会先执行上一次的清理函数，再运行新的 Effect。组件卸载时也会执行清理。', '',
      '> 一个 Effect 应当描述一个独立的同步过程。不要把无关的行为混在同一个 Effect 中。', '',
      '## 3. 常见问题与实践', '',
      '先从触发条件和数据来源判断问题，再决定是否需要增加状态或 Effect。', '',
      '### 避免不必要的 Effect', '',
      '筛选列表、拼接名称等纯计算可以在渲染期间完成。不要通过额外的 Effect 将派生结果再次写入状态。', '',
      '### 异步请求与过时响应', '',
      '请求参数改变后，旧请求可能比新请求更晚返回。使用清理机制隔离过时响应，避免旧结果覆盖当前页面。', '',
      '```tsx', 'useEffect(() => {', '  const controller = new AbortController();', '  loadData(query, controller.signal);', '  return () => controller.abort();', '}, [query]);', '```', '',
      '### 自定义 Hook 的边界', '',
      '将可复用的状态和同步逻辑组织到自定义 Hook 中。Hook 的参数应当表达业务含义，而不是隐藏依赖关系。', '',
      '## 4. 小结', '',
      '用状态描述界面，用事件处理用户操作，用 Effect 同步外部系统。保持每部分职责清晰，组件就更容易理解。', '',
      '- 状态更新基于当前渲染的快照。', '- 派生数据优先直接计算。', '- Effect 应当具有清晰的依赖和清理逻辑。', ''
    ].join('\n');

    /** 转义用户编辑内容，原型不执行 Markdown 中的 HTML。 */
    function escapeHtml(text) { return text.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
    function inline(text) { return escapeHtml(text).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

    /** 原型仅模拟源码编辑和行定位，保持同一编辑节点以保留输入焦点。 */
    function setSource(text) {
      source.innerHTML = text.split('\n').map((line, index) => `<div class="source-line${/^#{1,6}\s/.test(line) ? ' is-heading' : ''}${/^```/.test(line) ? ' is-code' : ''}" data-line="${index + 1}">${line ? escapeHtml(line) : '<br>'}</div>`).join('');
      currentText = text;
      render(text);
    }

    /** 离线预览只覆盖此原型的 Markdown 示例，不替代项目 useMarkdown。 */
    function render(text) {
      const lines = text.split('\n');
      const html = [];
      headings = [];
      blocks = [];
      let fence = false;
      let fenceStart = 0;
      let code = [];
      let list = [];
      let listStart = 0;
      const push = (markup, line) => html.push(`<div data-source-line="${line}">${markup}</div>`);
      const flushList = () => { if (list.length) { push(`<ul>${list.map(item => `<li>${inline(item)}</li>`).join('')}</ul>`, listStart); list = []; } };
      lines.forEach((line, index) => {
        const row = index + 1;
        if (/^```/.test(line)) {
          flushList();
          if (fence) { push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`, fenceStart); code = []; }
          else fenceStart = row;
          fence = !fence;
          return;
        }
        if (fence) { code.push(line); return; }
        const heading = line.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
          flushList();
          const entry = { id: `section-${row}`, text: heading[2].trim(), level: heading[1].length, line: row };
          headings.push(entry);
          push(`<h${entry.level} id="${entry.id}">${inline(entry.text)}</h${entry.level}>`, row);
        } else if (/^-\s/.test(line)) {
          if (!list.length) listStart = row;
          list.push(line.replace(/^-\s+/, ''));
        } else {
          flushList();
          if (/^>\s?/.test(line)) push(`<blockquote>${inline(line.replace(/^>\s?/, ''))}</blockquote>`, row);
          else if (line.trim()) push(`<p>${inline(line)}</p>`, row);
        }
      });
      flushList();
      if (code.length) push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`, fenceStart);
      preview.innerHTML = html.join('');
      byId('previewEmpty').hidden = !!text.trim();
      preview.hidden = !text.trim();
      blocks = Array.from(preview.querySelectorAll('[data-source-line]')).map(element => ({ line: Number(element.dataset.sourceLine), element }));
      toc.innerHTML = headings.map(item => `<a class="toc-link level-${item.level}" href="#${item.id}" data-id="${item.id}" title="${escapeHtml(item.text)}"><span class="toc-marker" aria-hidden="true"></span><span>${escapeHtml(item.text)}</span></a>`).join('');
      byId('headingCount').textContent = String(headings.length);
      byId('previewStatus').textContent = '已同步';
      showTocState(headings.length ? 'ready' : 'empty');
      setActive(headings.some(item => item.id === activeId) ? activeId : (headings[0]?.id || ''));
    }

    /** 状态发生于目录区域，编辑区和预览仍可继续使用。 */
    function showTocState(state) {
      const box = byId('tocState');
      box.hidden = state === 'ready';
      toc.hidden = state !== 'ready';
      outline.setAttribute('aria-busy', String(state === 'loading'));
      if (state === 'empty') box.innerHTML = '<svg><use href="#i-list"/></svg><strong>暂无目录</strong>添加 Markdown 标题后将在这里显示。';
      if (state === 'loading') box.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><span>正在更新目录…</span>';
      if (state === 'error') {
        box.innerHTML = '<svg><use href="#i-alert"/></svg><strong>目录暂时无法显示</strong><button class="btn" type="button" id="retryToc">重试</button>';
        byId('retryToc').onclick = () => render(currentText);
      }
    }

    function setActive(id) {
      activeId = id;
      toc.querySelectorAll('a').forEach(link => {
        if (link.dataset.id === id) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
      byId('currentHeading').textContent = headings.find(item => item.id === id)?.text || '—';
    }

    /** 宽屏侧栏不阻断编辑；较窄视口使用模态抽屉并隔离底层焦点。 */
    function updatePanels() {
      outline.hidden = !tocOpen;
      metadata.hidden = !metadataOpen;
      byId('tocButton').setAttribute('aria-expanded', String(tocOpen));
      byId('metadataButton').setAttribute('aria-expanded', String(metadataOpen));
      const modalToc = tocOpen && !wide.matches;
      scrim.hidden = !(modalToc || metadataOpen);
      editing.inert = modalToc || metadataOpen;
      outline.inert = metadataOpen;
      if (modalToc) { outline.setAttribute('role', 'dialog'); outline.setAttribute('aria-modal', 'true'); }
      else { outline.removeAttribute('role'); outline.removeAttribute('aria-modal'); }
    }
    function toggleToc(open, returnFocus = false) {
      if (metadataOpen) closeMetadata(false);
      tocOpen = open;
      updatePanels();
      if (open && !wide.matches) byId('closeToc').focus();
      if (returnFocus) byId('tocButton').focus();
    }
    function closeMetadata(returnFocus = true) {
      metadataOpen = false;
      tocOpen = restoreToc;
      updatePanels();
      if (returnFocus) byId('metadataButton').focus();
    }
    byId('tocButton').onclick = () => toggleToc(!tocOpen, tocOpen);
    byId('closeToc').onclick = () => toggleToc(false, true);
    byId('metadataButton').onclick = () => {
      if (metadataOpen) return closeMetadata();
      restoreToc = tocOpen;
      tocOpen = false;
      metadataOpen = true;
      updatePanels();
      byId('closeMetadata').focus();
    };
    byId('closeMetadata').onclick = () => closeMetadata();
    scrim.onclick = () => metadataOpen ? closeMetadata() : toggleToc(false, true);

    /** 目录点击同时定位两栏；窄屏保留原来的编辑/预览视图。 */
    toc.onclick = event => {
      const link = event.target.closest('a');
      if (!link) return;
      event.preventDefault();
      const heading = headings.find(item => item.id === link.dataset.id);
      if (!heading) return;
      setActive(heading.id);
      if (!wide.matches) toggleToc(false, true);
      programmaticUntil = performance.now() + 250;
      const target = byId(heading.id);
      source.querySelectorAll('.is-target').forEach(element => element.classList.remove('is-target'));
      preview.querySelectorAll('.is-target').forEach(element => element.classList.remove('is-target'));
      const row = source.querySelector(`[data-line="${heading.line}"]`);
      if (row) {
        sourceScroll.scrollTop += row.getBoundingClientRect().top - sourceScroll.getBoundingClientRect().top - 22;
        row.classList.add('is-target');
      }
      if (target) {
        target.classList.add('is-target');
        if (previewScroll.clientHeight) previewScroll.scrollTop += target.getBoundingClientRect().top - previewScroll.getBoundingClientRect().top - 24;
      }
      byId('sourcePosition').textContent = `第 ${heading.line} 行`;
    };

    function switchView(view) {
      panes.dataset.view = view;
      byId('editTab').setAttribute('aria-selected', String(view === 'edit'));
      byId('previewTab').setAttribute('aria-selected', String(view === 'preview'));
      // 从隐藏视图切回来时恢复当前目录目标，避免移动端定位无效。
      const heading = headings.find(item => item.id === activeId);
      if (!heading) return;
      programmaticUntil = performance.now() + 250;
      const target = view === 'preview' ? byId(heading.id) : source.querySelector(`[data-line="${heading.line}"]`);
      const container = view === 'preview' ? previewScroll : sourceScroll;
      if (target) container.scrollTop += target.getBoundingClientRect().top - container.getBoundingClientRect().top - 24;
    }
    byId('editTab').onclick = () => switchView('edit');
    byId('previewTab').onclick = () => switchView('preview');
    byId('syncButton').onclick = () => {
      syncEnabled = !syncEnabled;
      byId('syncButton').setAttribute('aria-pressed', String(syncEnabled));
    };

    /** 使用原型 DOM 块模拟语义同步滚动，同时更新当前位置。 */
    function onScroll(side) {
      if (performance.now() < programmaticUntil) return;
      cancelAnimationFrame(syncFrame);
      syncFrame = requestAnimationFrame(() => {
        const from = side === 'source' ? sourceScroll : previewScroll;
        const elements = side === 'source'
          ? Array.from(source.querySelectorAll('[data-line]')).map(element => ({line: Number(element.dataset.line), element}))
          : blocks;
        let current = elements[0];
        const top = from.getBoundingClientRect().top + 32;
        for (const item of elements) { if (item.element.getBoundingClientRect().top <= top) current = item; else break; }
        if (!current) return;
        const chapter = headings.filter(item => item.line <= current.line).at(-1) || headings[0];
        if (chapter) setActive(chapter.id);
        if (side === 'source') byId('sourcePosition').textContent = `第 ${current.line} 行`;
        if (!syncEnabled || !split.matches) return;
        const target = side === 'source'
          ? blocks.filter(item => item.line <= current.line).at(-1)?.element
          : source.querySelector(`[data-line="${current.line}"]`);
        const to = side === 'source' ? previewScroll : sourceScroll;
        if (target) {
          programmaticUntil = performance.now() + 80;
          to.scrollTop += target.getBoundingClientRect().top - to.getBoundingClientRect().top - 24;
        }
      });
    }
    sourceScroll.onscroll = () => onScroll('source');
    previewScroll.onscroll = () => onScroll('preview');

    /** 按源码行读取文本，避免空行中的 br 被 innerText 重复计为换行。 */
    function readSource() {
      const children = Array.from(source.children);
      if (children.length && Array.from(source.childNodes).every(node => node.nodeType === Node.ELEMENT_NODE)) {
        return children.map(element => element.innerText.replace(/\r/g, '').replace(/\n$/, '')).join('\n');
      }
      return source.innerText.replace(/\r/g, '');
    }

    source.addEventListener('input', () => {
      const text = readSource();
      currentText = text;
      byId('previewStatus').textContent = '更新中…';
      clearTimeout(updateTimer);
      const revision = ++previewRevision;
      updateTimer = setTimeout(() => {
        if (revision !== previewRevision) return;
        render(text);
        // 只补充行定位数据，不重建可编辑节点和光标。
        source.querySelectorAll(':scope > div').forEach((element, index) => {
          element.classList.add('source-line');
          element.dataset.line = String(index + 1);
          element.classList.toggle('is-heading', /^#{1,6}\s/.test(element.textContent));
        });
      }, 250);
    });

    function setRatio(value) {
      ratio = Math.min(70, Math.max(35, value));
      panes.style.setProperty('--ratio', `${ratio}%`);
      byId('divider').setAttribute('aria-valuenow', String(Math.round(ratio)));
    }
    byId('divider').onpointerdown = event => {
      event.preventDefault();
      event.currentTarget.setPointerCapture(event.pointerId);
    };
    byId('divider').onpointermove = event => {
      if (!event.currentTarget.hasPointerCapture(event.pointerId)) return;
      const box = panes.getBoundingClientRect();
      setRatio((event.clientX - box.left) / box.width * 100);
    };
    byId('divider').onpointerup = event => {
      if (event.currentTarget.hasPointerCapture(event.pointerId)) event.currentTarget.releasePointerCapture(event.pointerId);
    };
    byId('divider').onkeydown = event => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); setRatio(ratio + (event.key === 'ArrowRight' ? 2 : -2)); }
    };

    function notify(text) {
      const toast = byId('toast');
      toast.textContent = text;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.hidden = true, 2600);
    }
    byId('saveButton').onclick = () => notify('原型演示：保存完成');
    byId('exitButton').onclick = () => notify('原型演示：返回普通编辑界面');
    byId('documentTitle').oninput = event => {
      const title = event.target.value.trim() || '未命名 Markdown 文档';
      document.querySelector('.document-title').textContent = title;
      document.querySelector('.document-title').title = title;
    };
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (metadataOpen) closeMetadata();
        else if (tocOpen) toggleToc(false, true);
        return;
      }
      if (event.key !== 'Tab') return;
      const modal = metadataOpen ? metadata : (tocOpen && !wide.matches ? outline : null);
      if (!modal) return;
      const focusable = Array.from(modal.querySelectorAll('button:not(:disabled),a[href],input')).filter(element => element.getClientRects().length);
      const first = focusable[0];
      const last = focusable.at(-1);
      if (event.shiftKey && (document.activeElement === first || !modal.contains(document.activeElement))) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && (document.activeElement === last || !modal.contains(document.activeElement))) { event.preventDefault(); first?.focus(); }
    });
    wide.addEventListener('change', () => {
      updatePanels();
      if (tocOpen && !wide.matches) byId('closeToc').focus();
    });
    split.addEventListener('change', () => {
      if (editing.inert) return;
      switchView(panes.dataset.view);
    });
    const state = new URLSearchParams(location.search).get('state');
    setSource(state === 'empty' ? '在这里记录你的想法。\n\n添加 Markdown 标题后，目录会自动更新。' : demoText);
    updatePanels();
    if (state === 'loading' || state === 'error') { toggleToc(true); showTocState(state); }
  </script>
</body>
</html>
