services:
  db:
    image: postgres:16-alpine
    container_name: prompt-skill-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-prompt_skill_manager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-prompt_skill_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: "ghcr.io/fncheng/prompt-skill-manager-api:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: prompt-skill-manager-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-prompt_skill_manager}?schema=public
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?请配置 ADMIN_PASSWORD_HASH}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?请配置 AUTH_JWT_SECRET}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: "ghcr.io/fncheng/prompt-skill-manager-web:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: prompt-skill-manager-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
